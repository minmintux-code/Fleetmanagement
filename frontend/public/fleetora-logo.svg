<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" fill="none" width="100%" height="100%">
  <defs>
    <!-- Glowing filter effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>
    
    <!-- Linear gradients -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#d9e2ec"/>
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- TRUCK ILLUSTRATION (THREE TRUCKS IN WHITE MONOCHROME) -->
  <g filter="url(#glow-white)">
    <!-- LEFT TRUCK (Medium Depth) -->
    <g transform="translate(75, 20) scale(0.72)" opacity="0.85">
      <!-- Container / Cargo Box -->
      <path d="M 20 50 L 140 50 C 145 50 148 53 148 58 L 148 110 L 20 110 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="45" y1="50" x2="45" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="80" y1="50" x2="80" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="115" y1="50" x2="115" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <!-- Cab -->
      <path d="M 152 70 L 175 70 C 182 70 188 74 191 80 L 200 95 C 202 98 203 102 203 105 L 203 110 L 152 110 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
      <!-- Windshield -->
      <path d="M 168 76 L 178 76 C 183 76 187 79 189 84 L 194 92 L 168 92 Z" fill="#FFFFFF" opacity="0.9"/>
      <!-- Side Aero Fairing -->
      <path d="M 148 50 L 165 60 L 152 70 Z" fill="#FFFFFF" opacity="0.8"/>
      <!-- Chassis / Wheels -->
      <line x1="15" y1="112" x2="208" y2="112" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="45" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
      <circle cx="68" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
      <circle cx="125" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
      <circle cx="178" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
    </g>

    <!-- RIGHT TRUCK (Medium Depth) -->
    <g transform="translate(265, 20) scale(0.72)" opacity="0.85">
      <!-- Container / Cargo Box -->
      <path d="M 20 50 L 140 50 C 145 50 148 53 148 58 L 148 110 L 20 110 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="45" y1="50" x2="45" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="80" y1="50" x2="80" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="115" y1="50" x2="115" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <!-- Cab -->
      <path d="M 152 70 L 175 70 C 182 70 188 74 191 80 L 200 95 C 202 98 203 102 203 105 L 203 110 L 152 110 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
      <!-- Windshield -->
      <path d="M 168 76 L 178 76 C 183 76 187 79 189 84 L 194 92 L 168 92 Z" fill="#FFFFFF" opacity="0.9"/>
      <!-- Side Aero Fairing -->
      <path d="M 148 50 L 165 60 L 152 70 Z" fill="#FFFFFF" opacity="0.8"/>
      <!-- Chassis / Wheels -->
      <line x1="15" y1="112" x2="208" y2="112" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="45" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
      <circle cx="68" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
      <circle cx="125" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
      <circle cx="178" cy="115" r="9" fill="#000" stroke="#FFFFFF" stroke-width="3.5"/>
    </g>

    <!-- CENTER TRUCK (PROMINENT CENTER FRONT) -->
    <g transform="translate(145, 8) scale(0.92)" filter="url(#glow-cyan)">
      <!-- Container / Cargo Box -->
      <path d="M 20 40 L 150 40 C 156 40 160 44 160 50 L 160 110 L 20 110 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Vertical Container Ribs -->
      <line x1="48" y1="40" x2="48" y2="110" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
      <line x1="85" y1="40" x2="85" y2="110" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
      <line x1="122" y1="40" x2="122" y2="110" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
      <!-- Roof Deflector / Aero Wing -->
      <path d="M 160 40 Q 185 45 195 62 L 164 64 Z" fill="#FFFFFF"/>
      <!-- Heavy Duty Cab -->
      <path d="M 164 64 L 192 64 C 200 64 207 68 211 75 L 222 93 C 224 96 225 100 225 104 L 225 110 L 164 110 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <!-- Windshield -->
      <path d="M 180 70 L 194 70 C 200 70 205 74 207 80 L 214 90 L 180 90 Z" fill="#FFFFFF"/>
      <!-- Front Grille Accent -->
      <line x1="216" y1="96" x2="224" y2="96" stroke="#FFFFFF" stroke-width="3.5"/>
      <line x1="217" y1="102" x2="224" y2="102" stroke="#FFFFFF" stroke-width="3.5"/>
      <!-- Headlight Beam -->
      <polygon points="225,103 248,101 248,109 225,107" fill="url(#cyan-accent)" opacity="0.85"/>
      <!-- Base Line / Ground -->
      <line x1="10" y1="112" x2="232" y2="112" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <!-- Wheels -->
      <circle cx="48" cy="116" r="11" fill="#000" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="75" cy="116" r="11" fill="#000" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="135" cy="116" r="11" fill="#000" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="196" cy="116" r="11" fill="#000" stroke="#FFFFFF" stroke-width="4"/>
    </g>
  </g>

  <!-- BRAND NAME: FLEETORA -->
  <text x="250" y="170" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="6" 
        fill="url(#silver-grad)" 
        text-anchor="middle"
        filter="url(#glow-white)">
    FLEETORA
  </text>

  <!-- SUB-HEADER: SINCE 2026 -->
  <text x="250" y="202" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="9" 
        fill="#00f0ff" 
        text-anchor="middle"
        opacity="0.95"
        filter="url(#glow-cyan)">
    SINCE 2026
  </text>

  <!-- DECORATIVE BOTTOM LINE -->
  <line x1="170" y1="216" x2="330" y2="216" stroke="url(#cyan-accent)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
